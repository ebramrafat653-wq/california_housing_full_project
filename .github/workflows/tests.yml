# ============================================
# GitHub Actions CI Pipeline
# ============================================
name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs core dependencies + dev tools (ruff, pytest-cov, mypy) from pyproject.toml
        pip install -e .[dev]

    - name: Lint with Ruff
      continue-on-error: true
      run: |
        ruff check src/ tests/

    - name: Run unit tests (fast)
      env:
        KAGGLE_CONFIG_DIR: "/tmp/kaggle" # Prevents accidental Kaggle API calls in CI
      run: |
        # pytest automatically reads addopts from pyproject.toml (including -m 'not integration')
        pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      # Only upload once (from Python 3.11) to save CI minutes
      if: matrix.python-version == '3.11' && success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false