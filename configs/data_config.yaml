#configs/data_config.yaml

# =============================================================================
# California Housing Project — Data Configuration
# Compatible with: Linux, macOS, Windows, Google Colab
# Used by: src/data/ingestion.py, src/data/validation.py, src/utils/colab_setup.py
# =============================================================================

# -----------------------------------------------------------------------------
# DATASET SOURCE
# -----------------------------------------------------------------------------
dataset:
  name: "california_housing"
  source: "kaggle"
  kaggle_id: "saraferguswps/california-housing"

  # Files expected after download/unzip (used by verify_download_integrity)
  expected_files:
    - "housing.csv"

  # Options passed to pd.read_csv
  encoding: "utf-8"
  csv_options:
    sep: ","
    header: 0
    index_col: null
    na_values: ["?", "NA", "N/A", "null", "None"]

# -----------------------------------------------------------------------------
# PROJECT METADATA
# -----------------------------------------------------------------------------
project:
  name: "california_housing_full_project"
  target: "median_house_value"
  task_type: "regression"
  description: "Predict median house value in California districts using census data"

# -----------------------------------------------------------------------------
# DATA VALIDATION RULES
# -----------------------------------------------------------------------------
validation:
  max_missing_ratio: 0.3
  min_rows: 100
  min_columns: 5

  required_columns:
    - "longitude"
    - "latitude"
    - "housing_median_age"
    - "total_rooms"
    - "total_bedrooms"
    - "population"
    - "households"
    - "median_income"
    - "ocean_proximity"
    - "median_house_value"

  allow_fully_null_columns: false

# -----------------------------------------------------------------------------
# TRAIN/TEST SPLIT
# -----------------------------------------------------------------------------
split:
  test_size: 0.2
  random_state: 42
  shuffle: true

# -----------------------------------------------------------------------------
# DVC CONFIGURATION
# -----------------------------------------------------------------------------
# Remote type: local path on Google Drive (Drive is mounted in Colab, so
# dvc push/pull work like a local filesystem — no OAuth, no internet needed).
#
# Remote path on Drive: MyDrive/dvc_storage/
# DVC cache  on Drive: MyDrive/california_housing_full_project_dvc_cache/
# -----------------------------------------------------------------------------
dvc:
  enabled: true

  remote:
    name: "mylocal"                 
    type: "local"                   
    default: true

  tracked_paths:
    - "data/raw"
    - "data/interim"
    - "data/processed"
    - "models"

  auto_pull:
    enabled: true
    force: false
    targets:
      - "data/raw"                 

  cache:
    type: "symlink"                
    protected: true                