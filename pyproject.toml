# =============================================================================
# CALIFORNIA HOUSING FULL PROJECT — pyproject.toml
# Modern Python Packaging Standard (PEP 621)
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


# =============================================================================
# PROJECT METADATA
# =============================================================================
[project]
name = "california-housing-full-project"
version = "1.0.0"
description = "Production-ready ML pipeline for California Housing price prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Ebram Rafat", email = "ebram.rafat@example.com" }
]

keywords = [
    "machine-learning",
    "california-housing",
    "dvc",
    "mlops",
    "production-pipeline",
    "fastapi",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]


# =============================================================================
# CORE DEPENDENCIES
# Installed with: pip install .
# Only what the API/inference runtime needs at import time.
# =============================================================================
dependencies = [
    # Core data & ML
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",

    # Config & utilities
    "pyyaml>=6.0",
    "typeguard>=4.0.0",

    # Web API (for serving the model)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
]


# =============================================================================
# OPTIONAL DEPENDENCY GROUPS
# Install combinations:
#     pip install -e ".[test]"        # fast CI (API tests only)
#     pip install -e ".[dev]"         # full local dev
#     pip install -e ".[pipeline]"    # DVC + MLflow + Kaggle
#     pip install -e ".[all]"         # everything
# =============================================================================
[project.optional-dependencies]

# ── Testing only (fast, used by CI) ────────────────────────────────────────
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1",
    "httpx>=0.25.0",          # Required by fastapi.testclient.TestClient
]

# ── Development tools (linters, formatters, notebooks) ────────────────────
dev = [
    "black>=23.0",
    "ruff>=0.6.0",
    "mypy>=1.5",
    "ipykernel>=6.0",         # For Jupyter / Colab development
    "tqdm>=4.66.0",           # Progress bars during local development
]

# ── Data pipeline (heavy — only needed for training / data prep) ──────────
pipeline = [
    "dvc[gdrive]>=3.40.0",
    "kaggle>=1.5.16",
    "mlflow>=2.8.0",
]

# ── Convenience meta-extra (installs everything) ──────────────────────────
all = [
    "california-housing-full-project[test,dev,pipeline]",
]


# =============================================================================
# PROJECT URLS
# =============================================================================
[project.urls]
Homepage = "https://github.com/yourusername/california-housing-full-project"
Repository = "https://github.com/yourusername/california-housing-full-project"
Issues = "https://github.com/yourusername/california-housing-full-project/issues"
Changelog = "https://github.com/yourusername/california-housing-full-project/blob/main/CHANGELOG.md"


# =============================================================================
# PACKAGE DISCOVERY
# =============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*"]
namespaces = false


# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--strict-markers",
    "-m", "not integration",
    "--tb=short",
]

markers = [
    "integration: end-to-end tests requiring external services (DVC, Kaggle)",
    "slow: tests that take >5 seconds",
    "requires_dvc: tests requiring DVC initialization",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]


# =============================================================================
# RUFF CONFIGURATION (modern format, ruff >= 0.2)
# =============================================================================
[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults (FastAPI Depends)
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]     # Allow unused imports in __init__.py
"tests/*" = ["B011", "S101"] # Allow assert statements in tests

[tool.ruff.lint.isort]
known-first-party = ["api", "src"]


# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "yaml.*",
    "kaggle.*",
    "mlflow.*",
    "dvc.*",
]
ignore_missing_imports = true


# =============================================================================
# BLACK CONFIGURATION
# =============================================================================
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''


# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
source = ["api", "src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]