stages:

  # ============================================================
  # 1. INGESTION
  # ============================================================
  ingestion:
    cmd: python -m src.data.ingestion --no-dvc
    deps:
      - src/data/ingestion.py
      - src/data/data_loader.py
      - src/utils/paths.py
      - configs/data_config.yaml
    outs:
      - data/raw/housing.csv


  # ============================================================
  # 2. VALIDATION
  # ============================================================
  validation:
    cmd: python -m src.data.validation
    deps:
      - src/data/validation.py
      - data/raw/housing.csv
      - configs/data_config.yaml
    params:
      - configs/data_config.yaml:
          - validation
    outs:
      - reports/validation


  # ============================================================
  # 3. SPLITTING
  # ============================================================
  splitting:
    cmd: python -m src.data.splitting
    deps:
      - src/data/splitting.py
      - data/raw/housing.csv
      - configs/data_config.yaml
    params:
      - configs/data_config.yaml:
          - split
    outs:
      - data/interim


  # ============================================================
  # 4. CLEANING
  # ============================================================
  cleaning:
    cmd: python -m src.data.cleaning
    deps:
      - src/data/cleaning.py
      - data/interim
      - configs/data_config.yaml
    params:
      - configs/data_config.yaml:
          - eda_derived.missingness
          - eda_derived.target_summary
    outs:
      - data/processed/train_clean.csv
      - data/processed/val_clean.csv
      - data/processed/test_clean.csv
      - artifacts/cleaning_metadata.json


  # ============================================================
  # 5. FEATURE ENGINEERING
  # ============================================================
  # Deterministic lineage / inspection stage only.
  # The training pipeline DOES NOT consume *_feat.csv.
  # It performs the same FeatureEngineer implementation internally
  # inside the CV-safe sklearn Pipeline.
  # ============================================================
  engineering:
    cmd: python -m src.features.engineering
    deps:
      - src/features/engineering.py
      - data/processed/train_clean.csv
      - data/processed/val_clean.csv
      - data/processed/test_clean.csv
      - configs/data_config.yaml
    params:
      - configs/data_config.yaml:
          - eda_derived.engineered_features
    outs:
      - data/processed/train_feat.csv
      - data/processed/val_feat.csv
      - data/processed/test_feat.csv


  # ============================================================
  # 6. COMPLETE ML PIPELINE
  # ============================================================
  # DVC calls the external orchestration layer.
  # run_pipeline.py performs:
  #   Benchmarking
  #        ↓
  #   Tuning
  #        ↓
  #   Final Fit on Train + Validation
  #        ↓
  #   Final Test Evaluation
  # All learned preprocessing remains inside sklearn Pipeline.
  # MLflow tracking is handled by run_pipeline.py.
  # ============================================================
  ml_pipeline:
    cmd: python -m pipelines.run_pipeline
    deps:
      - pipelines/run_pipeline.py
      - src/models/training.py
      - src/models/tuning.py
      - src/models/evaluation.py
      - src/models/model_factory.py
      - src/features/pipeline.py
      - src/features/engineering.py
      - data/processed/train_clean.csv
      - data/processed/val_clean.csv
      - data/processed/test_clean.csv
      - configs/data_config.yaml
      - configs/model_config.yaml
    params:
      - configs/data_config.yaml:
          - features_config
          - eda_derived.missingness
          - eda_derived.lof
          - eda_derived.engineered_features
      - configs/model_config.yaml:
          - project
          - data
          - cross_validation
          - model_selection
          - models
          - tuning
          - search_spaces
          - final_training
          - evaluation
          - mlflow
          - artifacts
    outs:
      - artifacts/final_model_pipeline.pkl
      - reports/training_report.json
      - reports/cv_results.csv
      - reports/test_results.json
      - reports/test_predictions.csv
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/residuals.png:
          cache: false
      - reports/pred_vs_actual.png:
          cache: false
      - reports/feature_importance.png:
          cache: false